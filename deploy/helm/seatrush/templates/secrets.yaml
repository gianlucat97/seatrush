{{- if not .Values.global.secrets.existingSecret }}
{{/*
The four secrets of README section 13, in one Secret the release owns.

One and not one per service, because two of them are shared: the admission secret is held by
queue-service, which mints a token, and by the gateway, which checks it, and the Postgres
password by the three services that own a database. A Secret per service would be the same
value written in three places, and the failure that follows from them drifting is every
purchase command answering 403 with nothing in any log to say why.

A service still reads only the keys it is given (`secretEnv` in its values.yaml): the gateway
is the one thing that sees the key user tokens are signed with, and order-service the one
thing that sees the key tickets are signed with.

`stringData`, so the values are readable in the chart and in a diff. They are base64 already,
being bytes rather than text, and Kubernetes encodes them again on the way in; what is in
`values.yaml` is deliberately fake and says so when you decode it. A deployment that is not a
laptop sets `global.secrets.existingSecret` and this template renders nothing at all.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seatrush.release" . }}-secrets
  labels:
    {{- include "seatrush.component.labels" (dict "context" . "name" "seatrush" "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  auth-secret: {{ .Values.global.secrets.authSecret | quote }}
  admission-secret: {{ .Values.global.secrets.admissionSecret | quote }}
  postgres-password: {{ .Values.global.secrets.postgresPassword | quote }}
  {{/*
  Both keys are always present and may be empty, because order-service names them whether or
  not they are set: an empty value is what makes it generate a throwaway pair and say so,
  while a key missing from the Secret is a pod that never starts.
  */}}
  tickets-private-key: {{ .Values.global.secrets.ticketsPrivateKey | quote }}
  tickets-public-key: {{ .Values.global.secrets.ticketsPublicKey | quote }}
{{- end }}
