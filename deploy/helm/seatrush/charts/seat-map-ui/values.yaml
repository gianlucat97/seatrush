# The demo client (README section 6.7): the bundle behind nginx.
#
# In the Compose stack this container is also the one origin the page and the API share,
# because its nginx proxies /api to the gateway. In the cluster that job belongs to the
# Ingress, which routes /api to the gateway and everything else here: the same-origin
# property README section 6.7 depends on, kept by the one thing in front of both. The /api
# block of the image is therefore never reached here, and nothing in this repository
# configures CORS either way.

replicaCount: 1
port: 80

component: ui

image:
  name: seat-map-ui

needs:
  redis: false
  kafka: false

# Static files behind nginx: no actuator, so the three probes of the library do not apply.
# One path, and the same one for all three, because there is nothing this container can be
# alive for and not ready for.
probes:
  startupProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 2
    failureThreshold: 15
  livenessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 5

# The one container of this release that is not built from our Dockerfile, and every exception
# below is the upstream image's rather than ours. Everything of ours runs as uid 10001 on a
# read-only root filesystem with no capability at all.
#
# nginx starts as root here because that is what its image does: the master process binds port
# 80, creates its cache directories and then forks workers as the `nginx` user. Dropping
# everything and adding these four back is the smallest set that lets it:
#
#   NET_BIND_SERVICE   bind port 80, which is below 1024
#   CHOWN              hand the cache and run directories to the worker user
#   SETUID, SETGID     become that user in the workers
#
# Without the last two the master starts, fails to fork a single worker and exits, which reads
# as a crash loop with one line about setuid in the log.
#
# The root filesystem is writable for the same reason: the entrypoint of that image rewrites
# its own configuration under /etc/nginx before starting the server.
podSecurityContext:
  runAsUser: 0
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# Static files behind nginx: none of the Spring Boot configuration applies to it.
spring: false

# Read by the condition of the umbrella Chart.yaml. A release serving only an API turns
# this off and has no client.
enabled: true
