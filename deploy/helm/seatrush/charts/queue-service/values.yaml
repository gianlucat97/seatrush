# The waiting room: the lobby, the queue and the door of a sale (README section 6.2).

replicaCount: 1
port: 8084

# It owns no database. The queue, the lobby and the slots are Redis structures, which is why
# a pod of this service can be killed and replaced without anything being lost but the
# connections it held.
needs:
  redis: true
  # order.events, which is what frees a slot before its admission expires.
  kafka: true

env:
  # The event list, read on an interval: what opens the doors is inventory reporting the
  # sale as ON_SALE and not this service's clock (ADR-0015).
  SEATRUSH_INVENTORY_BASE_URL: http://{{ .Release.Name }}-inventory-service:8081
  # The gateway checks the admissions this service mints, so the lifetime is one value both
  # halves of the door read (README section 22).
  SEATRUSH_ADMISSION_TOKEN_TTL: "{{ .Values.global.admission.tokenTtl }}"
  # Both per pod, because the admission job runs on every pod with no leader, and both are
  # therefore divided by the `maxReplicas` below: four pods of this release admit the 500 a
  # second and hold the 5,000 active users README section 22 documents as the defaults, which
  # are figures about a sale and not about a fleet. The purchase area is bounded by seats and
  # by the checkouts inventory can absorb, so the number that has to stay fixed as this
  # service scales is the total.
  #
  # Fewer pods therefore open the door more slowly rather than more quickly, which is the
  # safe half of being wrong about it: a door that is too slow leaves buyers in the queue a
  # moment longer, and one that is too fast puts more buyers in the purchase area than there
  # are seats to sell them. The honest fix is a rate shared in Redis the way the queue itself
  # is, which is a change to the service and not to this chart (README section 24.3).
  SEATRUSH_ADMISSION_RATE_PER_SECOND: "125"
  SEATRUSH_ADMISSION_MAX_ACTIVE_USERS: "1250"
  # How late a sale can open, since this is how often the catalog is read.
  SEATRUSH_QUEUE_CATALOG_REFRESH_INTERVAL: 1s
  SEATRUSH_QUEUE_POSITION_UPDATE_INTERVAL: 3s
  SEATRUSH_SSE_HEARTBEAT_INTERVAL: "{{ .Values.global.sse.heartbeatInterval }}"
  SEATRUSH_SSE_TIMEOUT: "{{ .Values.global.sse.timeout }}"

# The other half of the door, shared with the gateway and with nothing else: two generated
# secrets would be two services refusing each other's tokens and every purchase answering
# 403 (README section 13).
secretEnv:
  SEATRUSH_ADMISSION_SECRET: admission-secret

# Memory before CPU: a pod of this service holds an SSE connection per waiting client, and
# what the admission job costs is one Lua call per sale per second however long the queue is.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi

# Open SSE connections per pod, and not CPU (README section 24.3). A pod of this service is
# almost idle while holding tens of thousands of waiting clients: what it costs is a socket
# and a buffer each, and the position update of every three seconds. CPU would therefore
# stay low right up to the point the pod ran out of memory or of file descriptors, which is
# the failure this metric is chosen to avoid.
#
# The metric is `seatrush_sse_connections` of README section 14.1, read through the custom
# metrics API of section 24.4. It is the one gauge of that section that is summed rather
# than maxed, because it counts what a single pod is holding, and that is exactly what makes
# it an autoscaling signal: an HPA on a Pods metric divides the sum by the pod count, so the
# figure below is connections per pod.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  podMetrics:
    seatrush_sse_connections: 2000
