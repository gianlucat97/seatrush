{{- $name := printf "%s-kafka" .Release.Name }}
{{- $labels := dict "context" . "name" "kafka" "component" "infrastructure" }}
{{/*
Single broker in KRaft mode, no ZooKeeper (README section 10).

A StatefulSet for the two things a broker needs that a Deployment cannot give it: a name
that survives the pod, which is what the controller quorum is addressed by, and the same
volume back after a restart, which is where the committed offsets of every consumer group
are. One replica, so every internal topic is single-replica and every business topic of
section 10.1 has a replication factor of one.

Nothing is published outside the cluster. A client that has to reach the broker from a
laptop goes through a port-forward rather than through a second advertised listener, which
would have to be resolvable from inside the cluster and from the host at once, and no single
address is.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "seatrush.component.labels" $labels | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
  selector:
    {{- include "seatrush.component.selectorLabels" $labels | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "seatrush.component.labels" $labels | nindent 4 }}
spec:
  # The per-pod name the controller quorum is addressed by. It has to resolve before the
  # broker is ready, which is what publishing not-ready addresses is for: the single voter
  # of this quorum is the pod itself, and it cannot become ready until it has reached it.
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: controller
      port: 9093
      targetPort: controller
  selector:
    {{- include "seatrush.component.selectorLabels" $labels | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "seatrush.component.labels" $labels | nindent 4 }}
spec:
  serviceName: {{ $name }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "seatrush.component.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "seatrush.component.labels" $labels | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.kafka.uid }}
        runAsGroup: {{ .Values.kafka.uid }}
        # What makes the volume writable by the uid the image runs as.
        fsGroup: {{ .Values.kafka.uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: {{ .Values.global.kafka.image | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy | quote }}
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@{{ $name }}-0.{{ $name }}-headless.{{ .Release.Namespace }}.svc:9093
            - name: KAFKA_LISTENERS
              value: INTERNAL://:9092,CONTROLLER://:9093
            # An advertised address has to be resolvable by the client that receives it, and
            # inside the cluster that is the Service every service already reaches it by.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://{{ $name }}:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Topics are created by the hook of the umbrella, with the partition count
            # section 10.1 specifies. Auto-creation would silently give a mistyped topic
            # name one partition and no error.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          # Both probes are the listener, and in KRaft that is a real answer rather than a
          # convenient one: the socket server only starts accepting once the broker has
          # loaded its metadata log and reached STARTED, so a reachable port is a broker
          # that can serve a request. The alternative, a metadata request made with the
          # shell tools of the image, was tried and is worse: it costs a JVM start inside
          # the broker's own cgroup on every probe, which on a node busy starting six
          # services takes longer than any sane timeout, so it reports the broker down
          # exactly when the broker is merely loaded.
          #
          # The asymmetry between the two is the whole of the difference. Readiness takes
          # the broker out of its Service within seconds, which costs nothing and is undone
          # as easily; liveness waits a minute and a half, because restarting a broker is
          # how a slow broker becomes no broker.
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 15
            failureThreshold: 6
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            # The image generates its server.properties and its logging configuration under
            # here on every start, from the KAFKA_ environment above.
            - name: config
              mountPath: /mnt/shared/config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
