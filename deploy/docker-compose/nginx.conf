# The one origin the demo client is served from (README sections 6.7 and 23).
#
# Two jobs, and the second is the interesting one. The bundle is static files; `/api` is
# proxied to the gateway, so the page and the API share an origin and the browser never makes
# a cross-origin request. That is why there is no CORS configuration anywhere in this
# repository, and this file is where that claim is kept true.

server {
    listen 80;
    # Both stacks, because `localhost` inside the container resolves to ::1 first: a server
    # listening on IPv4 alone refuses its own health check and the stack never comes up.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so a bundle may be cached for as long as it exists. One header and
    # not an `expires` beside it: the two of them send Cache-Control twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The fragment router of the client means every route is index.html; it is served without
    # caching so a redeploy is picked up on the next reload rather than on the next browser.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The two streams of this system are silent for minutes at a time by design (README
        # sections 12.2 and 12.3), so nothing here may decide that a quiet response is a dead
        # one, and nothing may hold bytes back waiting for more.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }
}
