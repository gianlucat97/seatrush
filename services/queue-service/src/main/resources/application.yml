# The defaults point at the Docker Compose stack of deploy/docker-compose, so the service
# starts against make up with no configuration. Every value is overridable by environment
# variable, which is how the container and the Helm chart set them (README section 22).
spring:
  application:
    name: queue-service
  threads:
    # Virtual threads: every request of this service blocks on Redis, and the platform thread
    # pool is exactly the limit README section 15 does not want (section 19).
    virtual:
      enabled: true
  data:
    redis:
      # The lobby, the queue and its counters (README section 9.2). This service has no
      # database of its own: Redis is all of its state.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    # Only order.events is read, and nothing is written: this service publishes no messages,
    # because it owns no database to keep an outbox in. The producer below exists for the dead
    # letter topic alone, which is where a record the listener cannot handle ends up.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # One group for the whole deployment: a slot is given back once. That is the opposite of
      # the broadcast pattern realtime uses, where every pod needs every seat event.
      group-id: ${KAFKA_GROUP_ID:queue-service}
      # An order that ended while every pod was down still ended, and its slot is still held.
      auto-offset-reset: earliest
      # The container commits the offset itself, after the handler has returned.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  jackson:
    datatype:
      datetime:
        # Instants as ISO-8601 strings, the format README section 12 publishes. Set
        # explicitly because it is part of the contract, not because Jackson 3 would
        # default the other way. In Jackson 3 this switch moved out of the
        # serialization features, so the key is no longer spring.jackson.serialization.
        write-dates-as-timestamps: false

seatrush:
  queue:
    # How far behind the catalog this service is allowed to be, which is also how late a sale
    # can open: inventory moves an event to ON_SALE and the lobby is shuffled within one
    # interval. One read per second serves every join of that second.
    catalog-refresh-interval: ${SEATRUSH_QUEUE_CATALOG_REFRESH_INTERVAL:1s}
    # The opener keeps passing over an open sale after its lobby is empty, so that a join which
    # landed in the lobby a moment before the doors opened is not left there.
    lobby-open-interval: ${SEATRUSH_QUEUE_LOBBY_OPEN_INTERVAL:1s}
    # Only how many users travel in one Lua call. The whole lobby is still shuffled as one,
    # because a shuffle of part of it would not be a shuffle.
    lobby-open-chunk-size: ${SEATRUSH_QUEUE_LOBBY_OPEN_CHUNK_SIZE:1000}
    # How often every listening client is looked at. A few seconds rather than one, because a
    # position is a number a human reads: three times the traffic would buy nothing anybody can
    # follow, and a client that wants it sooner can ask for it.
    position-update-interval: ${SEATRUSH_QUEUE_POSITION_UPDATE_INTERVAL:3s}
  admission:
    # The two numbers a waiting room exists for (README section 22). max-active-users is the one
    # that protects the system: whatever the queue is, inventory never sees more buyers holding
    # seats than this. rate-per-second only smooths the way in, so the cap is reached gradually
    # instead of as a step the moment a sale opens. Both are per pod, because the job runs on
    # every pod with no leader.
    rate-per-second: ${SEATRUSH_ADMISSION_RATE_PER_SECOND:500}
    max-active-users: ${SEATRUSH_ADMISSION_MAX_ACTIVE_USERS:5000}
    # How often the door is opened, which is also how often expired slots are freed: both happen
    # in one script, because the room to let somebody in is exactly what the freeing just made.
    interval: ${SEATRUSH_ADMISSION_INTERVAL:1s}
    # How long a buyer has in the purchase area. The same figure ends up in the admission token
    # and scores the slot in active:{evt:<id>}, so the two die together.
    token-ttl: ${SEATRUSH_ADMISSION_TOKEN_TTL:10m}
    # The HS256 secret the token is signed with, shared with the gateway and nothing else. Left
    # empty here, which makes the service generate one at startup and warn that it has.
    secret: ${SEATRUSH_ADMISSION_SECRET:}
  sse:
    # What a proxy or a mobile network needs to be told that a quiet stream is still alive. It
    # is a comment and not a position, because an unchanged position is not news and a waiting
    # room of a hundred thousand clients would broadcast it every few seconds.
    heartbeat-interval: ${SEATRUSH_SSE_HEARTBEAT_INTERVAL:15s}
    # How long one stream may stay open. A client that went away without closing anything leaves
    # a connection that looks open until something is written to it; ending the stream bounds
    # what a pod holds, and the client reconnects. Far longer than any ordinary wait.
    timeout: ${SEATRUSH_SSE_TIMEOUT:30m}
  inventory:
    # The catalog is read from inventory (README section 12.2). Both timeouts stay below the
    # refresh interval, so a hung read cannot pile one refresh on top of the next.
    base-url: ${SEATRUSH_INVENTORY_BASE_URL:http://localhost:8081}
    connect-timeout: ${SEATRUSH_INVENTORY_CONNECT_TIMEOUT:1s}
    read-timeout: ${SEATRUSH_INVENTORY_READ_TIMEOUT:2s}

# How long this process is allowed to take to stop, and it is arithmetic rather than a
# preference (README section 24.6). The chart gives a pod 45 seconds and sleeps 5 of them
# before the signal, so what is left for the process is 40: at most 10 for the web server to
# finish what it is serving, 10 for the Kafka containers to commit where they got to, and 10
# for a relay pass to finish, which leaves the last 10 as the margin before the kubelet stops
# asking.
#
# `server.shutdown` is not set here, because graceful is already the default in Boot 4. What
# that means for the two streaming services is only a bound: an SSE exchange does not finish
# on its own, so they close their streams on the context closing and the timeout below is
# what covers whatever is left (see QueueStreams and SeatMapStreams).
spring.lifecycle.timeout-per-shutdown-phase: 10s
spring.task.scheduling.shutdown.await-termination: true
spring.task.scheduling.shutdown.await-termination-period: 10s

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        # Health for the container probe, info for the build it is running, prometheus for the
        # scrape of deploy/prometheus (README section 14.1). Three and not the wildcard: the
        # rest of the actuator reads configuration, beans and environment, and this port is
        # open to everything inside the network by design (README section 13).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
        # What this pod has to have in place to be sent a request (README section 24.6).
        # No relay here, because this service owns no database; the listener it does have is
        # what frees a purchase area slot when a checkout finishes, and a pod not consuming
        # order events would hold slots until they expired.
        #
        # Not Redis, although the lobby, the queue and every admission are in it: a probe on it
        # would empty the Service of the one component a waiting client is connected to, at the
        # exact moment the store it reads is struggling.
          include: readinessState,kafkaListeners
  tracing:
    sampling:
      # No roots. The sampler is parent based, so zero does not mean "no traces": it means this
      # service never starts one of its own and always continues one that arrives, over HTTP or
      # in a message envelope. Every trace worth having is a request through the gateway, and
      # the alternative is a flood: the relays tick ten times a second and the schedulers once,
      # almost always finding nothing, and each tick would be a trace of its own with every
      # Redis command it made hanging underneath it.
      #
      # Raise it on one service to look at its background work, which is the case this is a knob
      # for. What those jobs do is otherwise in the metrics of README section 14.1.
      probability: ${SEATRUSH_TRACING_BACKGROUND_SAMPLE_RATE:0.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # The collector of deploy/docker-compose, over the port it publishes to the host. A
          # service started inside the stack network reaches it by name instead. There is no
          # default: an endpoint left unset means no exporter at all, so a service would carry a
          # trace through every hop and then drop it on the floor.
          endpoint: ${SEATRUSH_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
