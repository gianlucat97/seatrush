# The defaults point at the Docker Compose stack of deploy/docker-compose, so the service
# starts against make up with no configuration. Every value is overridable by environment
# variable, which is how the container and the Helm chart set them (README section 22).
spring:
  application:
    name: realtime-service
  threads:
    # Virtual threads: one batch pass writes to every connection of a sale in turn, and a client
    # that cannot take a write must not be holding a platform thread while it fails to
    # (section 19).
    virtual:
      enabled: true
  kafka:
    # Only inventory.seat-events is read, and nothing is written: this service changes nothing
    # anybody else reads. The producer below exists for the dead letter topic alone, which is
    # where a record the listener cannot handle ends up.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # No group id here on purpose. Every other service names its group in this file, because
      # one group per service is what makes each message somebody's work; this one needs a group
      # per pod, so the name is built at startup and the listener reads it from that bean
      # (BroadcastConsumerGroup, README section 6.6).
      #
      # From now on, and never from the backlog: a client catches up by loading a snapshot, so
      # the changes from before it connected are already in the map it is looking at. Replaying
      # them would be a burst of deltas every client discards by version.
      auto-offset-reset: latest
      # The container commits the offset itself, after the handler has returned. It matters
      # little here, since a new group starts at the end regardless, but a committed offset is
      # what lets the consumer lag of README section 14.1 be read for this service too.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  jackson:
    datatype:
      datetime:
        # Instants as ISO-8601 strings, the format README section 12 publishes. Set
        # explicitly because it is part of the contract, not because Jackson 3 would
        # default the other way. In Jackson 3 this switch moved out of the
        # serialization features, so the key is no longer spring.jackson.serialization.
        write-dates-as-timestamps: false

seatrush:
  realtime:
    # How long seat changes accumulate before they go out as one delta. A fifth of a second is
    # below what a person notices in a map that is being repainted anyway, and it turns the
    # thousands of changes a second of a flash on-sale into five messages a second per client.
    batch-window: ${SEATRUSH_REALTIME_BATCH_WINDOW:200ms}
  sse:
    # What a proxy or a mobile network needs to be told that a quiet stream is still alive. A
    # seat map is quiet for whole minutes at a time, which is exactly when a connection is at
    # risk of being dropped by something in the middle.
    heartbeat-interval: ${SEATRUSH_SSE_HEARTBEAT_INTERVAL:15s}
    # How long one stream may stay open. A client that went away without closing anything leaves
    # a connection that looks open until something is written to it, and a spectator tab left
    # open overnight is exactly that. The stream ends, the client reconnects and reloads a
    # snapshot, and what a pod holds stays bounded.
    timeout: ${SEATRUSH_SSE_TIMEOUT:30m}

# How long this process is allowed to take to stop, and it is arithmetic rather than a
# preference (README section 24.6). The chart gives a pod 45 seconds and sleeps 5 of them
# before the signal, so what is left for the process is 40: at most 10 for the web server to
# finish what it is serving, 10 for the Kafka containers to commit where they got to, and 10
# for a relay pass to finish, which leaves the last 10 as the margin before the kubelet stops
# asking.
#
# `server.shutdown` is not set here, because graceful is already the default in Boot 4. What
# that means for the two streaming services is only a bound: an SSE exchange does not finish
# on its own, so they close their streams on the context closing and the timeout below is
# what covers whatever is left (see QueueStreams and SeatMapStreams).
spring.lifecycle.timeout-per-shutdown-phase: 10s
spring.task.scheduling.shutdown.await-termination: true
spring.task.scheduling.shutdown.await-termination-period: 10s

server:
  port: ${SERVER_PORT:8085}

# The OpenAPI document of README section 12, served at /v3/api-docs and published under docs/api/.
# Both settings are about the bytes rather than the content: the published file is compared byte
# for byte by the test that generates it, so the writer has to produce the same document twice.
# Keys in a defined order instead of the order reflection happened to visit them in, and one
# pretty printer instead of whichever one the response happened to be written with.
springdoc:
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  # What these endpoints answer with, which the mappings do not say because there is nothing in
  # Spring MVC that needs telling: a method returning a record produces JSON. Unset, springdoc
  # describes every response as */*, which is true of the content negotiation and useless to a
  # reader. The endpoints that produce something else say so on their own mapping and keep it.
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        # Health for the container probe, info for the build it is running, prometheus for the
        # scrape of deploy/prometheus (README section 14.1). Three and not the wildcard: the
        # rest of the actuator reads configuration, beans and environment, and this port is
        # open to everything inside the network by design (README section 13).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
        # What this pod has to have in place to be sent a request (README section 24.6).
        # One contributor beyond the state, and it is the only thing this service does: a pod
        # whose consumer is not running holds seat map streams it will never write a delta to,
        # which is worse than no stream at all, because a client watching a map that has
        # stopped moving cannot tell the difference from a quiet venue.
          include: readinessState,kafkaListeners
  tracing:
    sampling:
      # No roots. The sampler is parent based, so zero does not mean "no traces": it means this
      # service never starts one of its own and always continues one that arrives, over HTTP or
      # in a message envelope. Every trace worth having is a request through the gateway, and
      # the alternative is a flood: the relays tick ten times a second and the schedulers once,
      # almost always finding nothing, and each tick would be a trace of its own with every
      # Redis command it made hanging underneath it.
      #
      # Raise it on one service to look at its background work, which is the case this is a knob
      # for. What those jobs do is otherwise in the metrics of README section 14.1.
      probability: ${SEATRUSH_TRACING_BACKGROUND_SAMPLE_RATE:0.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # The collector of deploy/docker-compose, over the port it publishes to the host. A
          # service started inside the stack network reaches it by name instead. There is no
          # default: an endpoint left unset means no exporter at all, so a service would carry a
          # trace through every hop and then drop it on the floor.
          endpoint: ${SEATRUSH_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
