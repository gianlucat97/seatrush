# The defaults point at the Docker Compose stack of deploy/docker-compose, so the service
# starts against make up with no configuration. Every value is overridable by environment
# variable, which is how the container and the Helm chart set them (README section 22).
spring:
  application:
    name: inventory-service
  threads:
    # Virtual threads: every request of this service blocks on Postgres or Redis, and the
    # platform thread pool is exactly the limit README section 15 does not want (section 19).
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/seatrush_inventory}
    username: ${POSTGRES_USER:seatrush}
    password: ${POSTGRES_PASSWORD:seatrush}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # README section 10.3: nothing is published unless every in-sync replica has it, and a
      # retried send cannot become a second message.
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      # The seat state of a live sale (README section 9.2).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    # The service owns the schema of its own database and migrates it on startup.
    enabled: true
    locations: classpath:db/migration
  jackson:
    datatype:
      datetime:
        # Instants as ISO-8601 strings, the format README section 12 publishes. Set
        # explicitly because it is part of the contract, not because Jackson 3 would
        # default the other way. In Jackson 3 this switch moved out of the
        # serialization features, so the key is no longer spring.jackson.serialization.
        write-dates-as-timestamps: false

# The hold path (README section 22).
seatrush:
  hold:
    # Five minutes is long enough to pick a payment method and short enough that a seat
    # abandoned by one user is back before the next one gives up looking.
    ttl: ${SEATRUSH_HOLD_TTL:5m}
    # Anti-hoarding: one hold is a group of friends, not a reseller's basket.
    max-seats: ${SEATRUSH_HOLD_MAX_SEATS:6}
    # The sweeper runs on every pod, so a second of lag costs nothing and the seats of an
    # abandoned hold are back almost immediately.
    sweeper-interval: ${SEATRUSH_HOLD_SWEEPER_INTERVAL:1s}
    sweeper-batch-size: ${SEATRUSH_HOLD_SWEEPER_BATCH_SIZE:500}
  stream-relay:
    # The seat map of every client is at most this far behind the seat state in Redis, so it is
    # tens of milliseconds. A blocking XREADGROUP is not used because the streams are per event
    # and the set of open sales changes while the service runs.
    poll-interval: ${SEATRUSH_STREAM_RELAY_POLL_INTERVAL:100ms}
    batch-size: ${SEATRUSH_STREAM_RELAY_BATCH_SIZE:500}
    # Long enough that a slow publish is not stolen from a relay still working on it.
    claim-idle-after: ${SEATRUSH_STREAM_RELAY_CLAIM_IDLE_AFTER:30s}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        # Health for the container probe, info for the build it is running. The Prometheus
        # endpoint arrives with the observability module.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
