# The defaults point at the services of README section 23 on a laptop, so the gateway starts
# against make up and the four services with no configuration. Every value is overridable by
# environment variable, which is how the container and the Helm chart set them (section 22).
spring:
  application:
    name: gateway
  # Reactive, and the only service in this repository that is: this process holds the SSE
  # connection of every waiting client, and a thread per connection is the limit README
  # section 15 refuses to have (section 6.1).
  main:
    web-application-type: reactive
  jackson:
    datatype:
      datetime:
        # Instants as ISO-8601 strings, the format README section 12 publishes.
        write-dates-as-timestamps: false
  data:
    redis:
      # The token buckets of README section 13, and the only state this service touches. It is
      # the same Redis the holds and the waiting room live in: a bucket is one small hash that
      # expires by itself, so it costs the store nothing that a sale would notice, and a second
      # Redis for it would be a second thing to run for no guarantee it buys.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # How long to wait for a service to accept the connection. Short, because a service
            # that is not listening is a 503 the client can retry rather than a request to hang
            # on to.
            connect-timeout: 2000
            # No response timeout on purpose. The seat map and the waiting room are streams that
            # are silent for minutes at a time by design, and a global timeout would cut them off
            # exactly when nothing is wrong.

seatrush:
  gateway:
    # Where the services are. On Kubernetes these are service names, so the cluster resolves
    # them and the gateway never learns how many pods answer.
    inventory: ${SEATRUSH_GATEWAY_INVENTORY_URL:http://localhost:8081}
    order: ${SEATRUSH_GATEWAY_ORDER_URL:http://localhost:8082}
    queue: ${SEATRUSH_GATEWAY_QUEUE_URL:http://localhost:8084}
    realtime: ${SEATRUSH_GATEWAY_REALTIME_URL:http://localhost:8085}
  auth:
    # The HS256 secret user tokens are signed with, held by this service alone. Left empty here,
    # which makes the gateway generate one at startup and warn that it has: fine for one process
    # on a laptop, wrong the moment there are two, because each would refuse the other's tokens.
    secret: ${SEATRUSH_AUTH_SECRET:}
    # How long a login lasts. A user token is only an identity; what bounds a buyer is the
    # admission, which lasts minutes.
    token-ttl: ${SEATRUSH_AUTH_TOKEN_TTL:1h}
  admission:
    # The other secret, shared with queue-service and nothing else. The gateway never mints an
    # admission: it only reads the ones the waiting room handed out.
    secret: ${SEATRUSH_ADMISSION_SECRET:}
    token-ttl: ${SEATRUSH_ADMISSION_TOKEN_TTL:10m}
  ratelimit:
    # Two buckets per scope, per user and per address (README sections 13 and 22). The per-user
    # numbers are what one buyer may do; the per-address ones have to hold a whole office or a
    # mobile carrier behind one address, so they are looser by two orders of magnitude and exist
    # to stop a script rather than to shape a buyer.
    #
    # Off is a deployment decision and not a development one: a stack with no Redis would
    # otherwise log a warning per request, and the limiter lets a request through when it cannot
    # reach the store anyway.
    enabled: ${SEATRUSH_RATELIMIT_ENABLED:true}
    # Joining is one request a buyer makes once, so the burst is small and the sustained rate is
    # the polling of a client that lost its stream rather than a rhythm anybody needs.
    queue-join:
      user:
        burst: ${SEATRUSH_RATELIMIT_QUEUE_JOIN_BURST:10}
        per-second: ${SEATRUSH_RATELIMIT_QUEUE_JOIN_PER_SECOND:2}
      ip:
        burst: ${SEATRUSH_RATELIMIT_QUEUE_JOIN_IP_BURST:500}
        per-second: ${SEATRUSH_RATELIMIT_QUEUE_JOIN_IP_PER_SECOND:200}
    # The expensive one, and the one a flash on-sale legitimately repeats: a buyer loses a seat
    # to somebody else and reaches again, which the simulation of README section 18.1.1 does up
    # to three times per attempt. The burst covers that with room to spare and still refuses a
    # client making a hundred attempts a second.
    hold:
      user:
        burst: ${SEATRUSH_RATELIMIT_HOLD_BURST:20}
        per-second: ${SEATRUSH_RATELIMIT_HOLD_PER_SECOND:5}
      ip:
        burst: ${SEATRUSH_RATELIMIT_HOLD_IP_BURST:1000}
        per-second: ${SEATRUSH_RATELIMIT_HOLD_IP_PER_SECOND:400}
    # The tightest, because a buyer has one hold to turn into one order. What the burst leaves
    # room for is the retry of a 503, which README section 12.6 says is safe to repeat.
    order:
      user:
        burst: ${SEATRUSH_RATELIMIT_ORDER_BURST:5}
        per-second: ${SEATRUSH_RATELIMIT_ORDER_PER_SECOND:1}
      ip:
        burst: ${SEATRUSH_RATELIMIT_ORDER_IP_BURST:300}
        per-second: ${SEATRUSH_RATELIMIT_ORDER_IP_PER_SECOND:100}

# How long this process is allowed to take to stop (README section 24.6). The chart gives a
# pod 45 seconds and sleeps 5 of them before the signal; what is left for the process is 40,
# and this is the bound on the one phase that matters here.
#
# It matters more here than anywhere else, and the reason is worth knowing: this service
# proxies both SSE streams of README section 12, and a proxied stream is an exchange that
# never completes. Graceful shutdown, which is the default in Boot 4, therefore waits for a
# stream that has no reason to end, and this timeout is what stops it waiting. The clients
# behind it reconnect the way an EventSource does, and the pod they land on is one that was
# told when to expect them (QueueStreams and SeatMapStreams of the services behind).
spring.lifecycle.timeout-per-shutdown-phase: 10s

server:
  port: ${SERVER_PORT:8080}

# The OpenAPI document of README section 12, served at /v3/api-docs and published under docs/api/.
# Both settings are about the bytes rather than the content: the published file is compared byte
# for byte by the test that generates it, so the writer has to produce the same document twice.
# Keys in a defined order instead of the order reflection happened to visit them in, and one
# pretty printer instead of whichever one the response happened to be written with.
springdoc:
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  # What these endpoints answer with, which the mappings do not say because there is nothing in
  # Spring MVC that needs telling: a method returning a record produces JSON. Unset, springdoc
  # describes every response as */*, which is true of the content negotiation and useless to a
  # reader. The endpoints that produce something else say so on their own mapping and keep it.
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        # Health for the container probe, info for the build it is running, prometheus for the
        # scrape of deploy/prometheus (README section 14.1). Three and not the wildcard: the
        # rest of the actuator reads configuration, beans and environment, and this port is
        # open to everything inside the network by design (README section 13).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      # A trace is born here and nowhere else, which is what this number decides. Everything
      # behind this service is reached either over HTTP, carrying the context in a header, or as
      # a message, carrying it in the envelope, so every trace in the system starts with a
      # request through this door (README section 6.1) and the other five services sample no
      # roots at all.
      #
      # Everything, locally and on the bench. A flash on-sale is the one workload where keeping
      # every trace is not an option in production, so this is a knob rather than a constant:
      # the interesting traces of an on-sale are the slow and the failed ones, and sampling
      # head-on at a tenth is how a benchmark loses exactly those.
      probability: ${SEATRUSH_TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # The collector of deploy/docker-compose, over the port it publishes to the host. A
          # service started inside the stack network reaches it by name instead. There is no
          # default: an endpoint left unset means no exporter at all, so a service would carry a
          # trace through every hop and then drop it on the floor.
          endpoint: ${SEATRUSH_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
